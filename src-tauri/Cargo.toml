[package]
name = "window-tracker"
version = "0.1.0"
description = "Winrak local window activity tracker"
edition = "2024"

[lib]
name = "window_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "window-tracker"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "native-active-window"]
native-active-window = ["dep:active-win-pos-rs"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
active-win-pos-rs = { version = "0.11", optional = true }
chrono = { version = "0.4", features = ["clock", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
